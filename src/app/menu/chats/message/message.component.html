<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="chat">
    <ion-header>
      <ion-toolbar class="chat-title">
        <ion-buttons slot="start">
          <ion-back-button defaultHref="/menu/chats" (click)="goBack()">
            <app-back-icon class="back-icon"></app-back-icon>
          </ion-back-button>
        </ion-buttons>
    
        <ion-title class="title-container" *ngIf="chatData$ | async as chatData">
          <h1>{{ chatData.otherUserName }}</h1>
          <h2>{{ isOnline ? 'En línea' : 'Sin conexión' }}</h2>
        </ion-title>
    
        <ion-avatar slot="end" class="avatar">
          <img [src]="otherUserProfileImage || 'https://img.freepik.com/vector-premium/vector-dibujos-animados-icono-galleta-cuadrada-comida-galleta-azucar-dulce_98402-61270.jpg'"
               (error)="handleProfileImageError($event)">
        </ion-avatar>
      </ion-toolbar>
    </ion-header>

    <!-- Indicador de estado de red -->
    <div *ngIf="!isOnline" class="network-status offline">
      <ion-icon name="cloud-offline"></ion-icon>
      Sin conexión - Mostrando mensajes almacenados
    </div>

    <div class="messages">
      <div class="messages-content" #scrollContainer>
        <!-- Loading indicator -->
        <div *ngIf="isLoading" class="loading-indicator">
          <ion-spinner name="crescent"></ion-spinner>
          <span>Cargando mensajes...</span>
        </div>

        <ng-container *ngIf="currentUser && !isLoading">
          <div *ngFor="let message of allMessages | async" 
               [ngClass]="{
                 'message-sent': currentUser && message.senderId === currentUser.uid,
                 'message-received': currentUser && message.senderId !== currentUser.uid,
                 'message-temp': message.isTemp
               }"
               class="message">
            <div class="message-bubble">
              <div class="message-text">{{ message.content }}</div>
              <div class="message-time">
                {{ message.timestamp | date:'shortTime' }}
                <span *ngIf="message.isTemp" class="sending-indicator">
                  <ion-spinner name="dots" size="small"></ion-spinner>
                </span>
              </div>
            </div>
          </div>
                  
          <div *ngIf="(allMessages | async)?.length === 0" class="no-messages">
            <p>No hay mensajes aún. ¡Sé el primero en escribir!</p>
          </div>
        </ng-container>
      </div>
    </div>

    <div class="message-box">
      <ion-input [(ngModel)]="mensaje" 
                 placeholder="Enviar mensaje" 
                 class="message-input"
                 (keyup.enter)="enviar_mensaje()"
                 [disabled]="!isOnline || isSending"></ion-input>

      <ion-button (click)="enviar_mensaje()" 
                  class="message-submit"
                  [disabled]="!mensaje.trim() || !isOnline || isSending">
        <ion-spinner *ngIf="isSending" name="dots" class="send-spinner"></ion-spinner>
        <span *ngIf="!isSending">Enviar</span>
      </ion-button>
    </div>
  </div>
</ion-content>
