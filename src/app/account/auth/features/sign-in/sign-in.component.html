<ion-content class="login-section">
  <div class="login-container ion-padding">
    <div class="ion-text-center">
      <h1>Inicia sesión</h1>
      
      <div class="google-button-container ion-margin-vertical">
        <app-google-button (onClick)="submitWithGoogle()"></app-google-button>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <ion-item class="ion-margin-bottom">
          <ion-input 
            type="email"
            name="email" 
            placeholder="usuario@gmail.com" 
            formControlName="email"
            [clearInput]="true"
          ></ion-input>
        </ion-item>
        <ion-text color="danger" *ngIf="isRequired('email')">
          <small>Este campo es requerido</small>
        </ion-text>
        <ion-text color="danger" *ngIf="hasEmailError()">
          <small>Correo invalido</small>
        </ion-text>

        <ion-item class="ion-margin-bottom">
          <ion-input 
            [type]="passwordInputType"
            name="password" 
            placeholder="••••••••" 
            formControlName="password"
            [clearInput]="true"
          ></ion-input>
          <ion-button 
            fill="clear" 
            class="toggle-password" 
            (click)="togglePasswordVisibility()"
          >
            <app-eye-button />
          </ion-button>
        </ion-item>

        <ion-text class="ion-margin-bottom ion-text-right">
          <ion-button 
            fill="clear" 
            color="medium" 
            routerLink="/auth/forgot-password"
          >
            Olvidaste tu contraseña?
          </ion-button>
        </ion-text>

        <ion-button 
          type="submit" 
          expand="block" 
          class="ion-margin-top"
        >
          Iniciar
        </ion-button>

        <ion-text class="ion-text-center ion-margin-top">
          <p>
            No tienes una cuenta? 
            <ion-button 
              fill="clear" 
              color="primary" 
              routerLink="/auth/sign-up"
            >
              Registrarse
            </ion-button>
          </p>
        </ion-text>
      </form>
    </div>
  </div>
</ion-content>
