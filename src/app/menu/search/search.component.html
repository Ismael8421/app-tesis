  <swiper-container>
    <swiper-slide>
      <ion-card class="content-container ion-no-margin">
        <ion-card-content class="profile-section">
          <!-- Sección superior: Avatar y nombre -->
          <div class="profile-header">
            <ion-avatar class="profile-img">
              <ion-img src="icons/logo_tesis.png" alt="Profile"></ion-img>
            </ion-avatar>

            <ion-text>
              <h3>NombreUsuario</h3>
            </ion-text>

            <ion-text color="medium">
              <small>Nombre Apellido</small>
            </ion-text>
          </div>

          <!-- Sección central: Información -->
          <div class="info-section">
            <ion-text>
              <p>Carrera</p>
            </ion-text>

            <ion-text>
              <p>Curso</p>
            </ion-text>
          </div>

          <!-- Sección inferior: Botones -->
          <div class="buttons-container">
            <ion-button fill="solid" shape="round" mode="ios">
              <app-messages-icon></app-messages-icon>
            </ion-button>

            <ion-button fill="solid" shape="round" mode="ios">
              <app-check-icon></app-check-icon>
            </ion-button>
          </div>
        </ion-card-content>
      </ion-card>
    </swiper-slide>
