<div>
  <h1>Preferencias Generales</h1>
  <div>
    <p>Horario de disponibilidad preferido (seleccionar uno o más)</p>
    <div>
      <div>
        <input type="checkbox" id="Q1O1">
        <label for="Q1O1">Durante el almuerzo</label>
      </div>
      
      <div>
        <input type="checkbox" id="Q1O2">
        <label for="Q1O2">Tardes después de clases</label>
      </div>

      <div>
        <input type="checkbox" id="Q1O3">
        <label for="Q1O3">Fines de semana por la mañana</label>
      </div>

      <div>
        <input type="checkbox" id="Q1O4">
        <label for="Q1O4">Fines de semana por la tarde</label>
      </div>
    </div>
  </div>

  <div>
    <p>Método de trabajo preferido</p>
    <div>
      <input type="radio" id="Q2O1" name="metodoTrabajo">
      <label for="Q2O1">Solo presencial</label>
    </div>

    <div>
      <input type="radio" id="Q2O2" name="metodoTrabajo">
      <label for="Q2O2">Solo virtual</label>
    </div>

    <div>
      <input type="radio" id="Q2O3" name="metodoTrabajo">
      <label for="Q2O3">Ambos</label>
    </div>
  </div>

  <div>
    <p>Estilo de trabajo preferido (seleccionaruna o más)</p>
    <div>
      <div>
        <input type="checkbox" id="Q3O1">
        <label for="Q3O1">Proactivo (me gusta tomar la iniciativa)</label>
      </div>
      
      <div>
        <input type="checkbox" id="Q3O2">
        <label for="Q3O2">Organizado (prefiero seguir un plan detallado)</label>
      </div>
      
      <div>
        <input type="checkbox" id="Q3O3">
        <label for="Q3O3">Flexible (me adapto a cualquier situación)</label>
      </div>
      
      <div>
        <input type="checkbox" id="Q3O4">
        <label for="Q3O4">Dependiente (prefiero trabajar con guía constante)</label>
      </div>
    </div>
  </div>

  <div>
    <p>Nivel de dedicación al proyecto</p>

    <div>
      <input type="radio" name="dedicacion" id="Q4O1">
      <label for="Q4O1">1-3 horas diarias</label>
    </div>
    
    <div>
      <input type="radio" name="dedicacion" id="Q4O2">
      <label for="Q4O2">4-6 horas diarias</label>
    </div>
    
    <div>
      <input type="radio" name="dedicacion" id="Q4O3">
      <label for="Q4O3">Flexible según necesidad</label>
    </div>
  </div>
</div>
