<ion-content>
  <ion-list>
    <ion-item (click)="navigateTo()" class="ion-activatable" button>
      <ion-avatar slot="start">
        <ion-img
          src="https://img.freepik.com/vector-premium/vector-dibujos-animados-icono-galleta-cuadrada-comida-galleta-azucar-dulce_98402-61270.jpg"
          alt="Perfil"></ion-img>
      </ion-avatar>
      <ion-label>Ver perfil</ion-label>
      <ion-ripple-effect></ion-ripple-effect>
    </ion-item>

    <ion-list-header>
      <ion-label>Configuraciones</ion-label>
    </ion-list-header>

    <ion-item>
      <ion-label>Tema</ion-label>
      <ion-select [value]="currentTheme" (ionChange)="onThemeChange($event)" interface="action-sheet"
        placeholder="Selecciona un tema">
        <ion-select-option *ngFor="let option of themeOptions" [value]="option.value">
          {{ option.label }}
        </ion-select-option>
      </ion-select>
    </ion-item>

    <ion-item button (click)="navigateToCPE()">
      <ion-label>Cambiar correo o contraseña</ion-label>
    </ion-item>

    <ion-item button>
      <ion-label>Reportar un error</ion-label>
    </ion-item>

    <ion-item button (click)="logOut()">
      <ion-label>Cerrar sesión</ion-label>
    </ion-item>
  </ion-list>
</ion-content>

<router-outlet></router-outlet>
