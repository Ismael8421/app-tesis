<section>
  <div>
    <div>
      <div>
        <div>
          <h1>Crea una cuenta</h1>
          <div class="google-button-container">
            <app-google-button (onClick)="submitWithGoogle()"></app-google-button>
          </div>            
        </div>
        <form [formGroup]="form" (ngSubmit)="submit()">
          <div>
            <label for="email">Correo</label><br>
            <input 
              type="email"
              name="email" 
              id="email"  
              placeholder="name@company.com" 
              formControlName="email"
            >
            <small *ngIf="isRequired('email')">Este campo es requerido</small>
            <small *ngIf="hasEmailError()">Correo invalido</small>
          </div>
          <div>
            <label for="password">Contraseña</label><div class="input-with-icon">
              <input 
                [type]="getPasswordInputType('password')"
                name="password" 
                id="password" 
                placeholder="••••••••" 
                formControlName="password"
              >
              <button type="button" class="toggle-password" (click)="togglePasswordVisibility()">
                <app-eye-button />
              </button>
            </div>
            <small *ngIf="isRequired('password')">Este campo es requerido</small>
          </div>
          <div>
            <label for="confirmPassword">Confirmar Contraseña</label><div class="input-with-icon">
              <input 
                [type]="getPasswordInputType('confirm')"
                name="confirmPassword" 
                id="confirmPassword" 
                placeholder="••••••••" 
                formControlName="confirmPassword"
              >
              <button type="button" class="toggle-password" (click)="toggleConfirmPasswordVisibility()">
                <app-eye-button />
              </button>
            </div>
            <small *ngIf="isConfirmPasswordRequired()">Este campo es requerido</small>
            <small *ngIf="!passwordsMatch() && form.get('confirmPassword')?.touched && form.get('confirmPassword')?.value">Las contraseñas no coinciden</small>
          </div>
          <button type="submit">Crear</button>
          <p>
            Ya tienes una cuenta? <a routerLink="/auth/sign-in">Iniciar sesión</a>
          </p>
        </form>
      </div>
    </div>
  </div>
</section>
