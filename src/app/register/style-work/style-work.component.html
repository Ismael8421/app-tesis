<div [formGroup]="form">
    <ion-text>
        <h1>Estilo de trabajo</h1>
    </ion-text>

    <ion-list>
        <ion-list-header>
            <ion-label>
                ¿Cómo describirías tu estilo de trabajo?
            </ion-label>
        </ion-list-header>

        <ion-radio-group formControlName="styleWork">
            <ion-item>
                <ion-radio id="proactive" value="Proactivo" slot="start"></ion-radio>
                <ion-label>Proactivo (me gusta tomar la iniciativa)</ion-label>
            </ion-item>

            <ion-item>
                <ion-radio id="organized" value="Organizado" slot="start"></ion-radio>
                <ion-label>Organizado (prefiero seguir un plan detallado)</ion-label>
            </ion-item>

            <ion-item>
                <ion-radio id="flexibleID" value="Flexible" slot="start"></ion-radio>
                <ion-label>Flexible (me adapto a cualquier situación)</ion-label>
            </ion-item>

            <ion-item>
                <ion-radio id="dependent" value="Dependiente" slot="start"></ion-radio>
                <ion-label>Dependiente (prefiero trabajar con guía constante)</ion-label>
            </ion-item>
        </ion-radio-group>
    </ion-list>
</div>
