<ion-content class="ion-padding">
  <ion-list class="settings-list">
    <!-- Perfil -->
    <ion-item (click)="navigateTo()" class="profile-item ion-activatable" button>
      <ion-avatar slot="start">
        <ion-img [src]="profileImageUrl || 'icons/logo_tesis.png'" alt="Perfil" (ionError)="handleImageError()">
        </ion-img>
      </ion-avatar>
      <ion-label>
        <h2>Ver perfil</h2>
        <p>Configuración de cuenta</p>
      </ion-label>
      <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
    </ion-item>

    <!-- Secciones de configuración -->
    <div class="section-group">
      <ion-item>
        <ion-icon name="eye-outline" slot="start" class="custom-icon"></ion-icon>
        <ion-label>Visibilidad del perfil</ion-label>
        <ion-button fill="clear" slot="end" (click)="showVisibilityInfo()">
          <ion-icon name="information-circle-outline" color="medium"></ion-icon>
        </ion-button>
        <ion-select [value]="currentVisibility" (ionChange)="onVisibilityChange($event)" interface="action-sheet">
          <ion-select-option value="visible">Visible para todos</ion-select-option>
          <ion-select-option value="visible_in_group">Visible (en grupo)</ion-select-option>
          <ion-select-option value="invisible">Invisible</ion-select-option>
        </ion-select>
      </ion-item>

      <ion-item *ngIf="isInGroup" button (click)="confirmLeaveGroup()" class="warning-item">
        <ion-icon name="exit-outline" slot="start" class="custom-icon warning"></ion-icon>
        <ion-label color="warning">Abandonar grupo</ion-label>
      </ion-item>
    </div>

    <div class="section-group">
      <ion-item>
        <ion-icon name="contrast-outline" slot="start" class="custom-icon"></ion-icon>
        <ion-label>Tema</ion-label>
        <ion-select [value]="currentTheme" (ionChange)="onThemeChange($event)" interface="action-sheet">
          <ion-select-option *ngFor="let option of themeOptions" [value]="option.value">
            {{ option.label }}
          </ion-select-option>
        </ion-select>
      </ion-item>
    </div>

    <div class="section-group">
      <ion-item button (click)="navigateToCPE()">
        <ion-icon name="key-outline" slot="start" class="custom-icon"></ion-icon>
        <ion-label>Cambiar correo o contraseña</ion-label>
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
      </ion-item>

      <ion-item button (click)="navigateToReport()">
        <ion-icon name="alert-circle-outline" slot="start" class="custom-icon"></ion-icon>
        <ion-label>Reportar un error</ion-label>
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
      </ion-item>
    </div>

    <div class="section-group">
      <ion-item button (click)="logOut()" class="logout-item">
        <ion-icon name="log-out-outline" slot="start" class="custom-icon danger"></ion-icon>
        <ion-label color="danger">Cerrar sesión</ion-label>
      </ion-item>
    </div>
  </ion-list>
</ion-content>
