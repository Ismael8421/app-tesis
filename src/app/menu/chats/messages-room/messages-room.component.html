<body>
    <div class="chat-container">
        <div class="chat-title">Chats</div>
        <div class="search-container">
            <form>
                <div class="search-input">
                    <input type="text" placeholder="Buscar" required />
                    <button type="submit">
                        <app-recomendatio-icon class="icon" />
                    </button>
                </div>
            </form>
        </div>

        <div class="chat-card" (click)="navigateTo()">
            <img src="https://img.freepik.com/vector-premium/vector-dibujos-animados-icono-galleta-cuadrada-comida-galleta-azucar-dulce_98402-61270.jpg"
                class="img">
            <div class="text-container">
                <h3 class="name">Nombre</h3>
                <small class="last-message">Ultimo mensaje</small>
            </div>
        </div>
    </div>
</body>
