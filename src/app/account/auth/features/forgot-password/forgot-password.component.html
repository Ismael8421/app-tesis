<div class="forgot-password-container">
  <div class="form-wrapper">
    <form (ngSubmit)="onReset()" class="forgot-form">
      <img src="assets/wordpress-logo.png" alt="Logo" class="logo">
      
      <h3 class="form-title">Ingresa tu correo</h3>
      
      <div class="form-group">
        <input 
          type="email" 
          [formControl]="userEmail"
          placeholder="Correo electrónico"
          class="form-input"
          required>
      </div>

      <button type="submit" class="submit-button">
        Enviar
      </button>

      <a routerLink="/sign-in" class="back-link">
        Volver a Inicio de sesión
      </a>
    </form>
  </div>
</div>
