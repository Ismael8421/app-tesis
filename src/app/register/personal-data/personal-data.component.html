<div [formGroup]="form">
  <h1>Datos personales </h1>
    <div>
      <label>Nombre de Usuario</label>
      <input 
        id="username"
        type="text"
        formControlName="username"
        >
        <div *ngIf="form.controls['username'].invalid && form.controls['username'].touched">
          <small>Este campo es obligatorio</small>
        </div>
    </div>
  
    <div class="form-group">
      <label>Nombre</label>
      <input 
        id="name"
        type="text"
        formControlName="name"
        >
        <div *ngIf="form.controls['name'].invalid && form.controls['name'].touched">
          <small>Este campo es obligatorio</small>
        </div>
    </div>
  
    <div class="form-group">
      <label>Apellido</label>
      <input 
        id="lastName"
        type="text"
        formControlName="lastName"
        >
        <div *ngIf="form.controls['lastName'].invalid && form.controls['lastName'].touched">
          <small>Este campo es obligatorio</small>
        </div>
    </div>
  
    <div class="form-group">
      <label>Año Lectivo</label>
      <select id="course" formControlName="course">
        <option value="" disabled selected>Elige una opción</option>
        <option value="Primero">Primero </option>
        <option value="Segundo">Segundo</option>
        <option value="Tercero">Tercero</option>
      </select>
        <div *ngIf="form.controls['course'].invalid && form.controls['course'].touched">
          <small>Este campo es obligatorio</small>
        </div>
    </div>
  
    <div class="form-group">
      <label>Carrera</label>
      <select id="profession" formControlName="profession">
        <option value="" disabled selected>Elige una opción</option>
        <option value="IEME">IEME</option>
        <option value="MCM">MCM</option>
        <option value="EMA">EMA</option>
        <option value="Mecatrónica">Mecatrónica</option>
        <option value="Informática">Informática</option>
        <option value="Ciencias">Ciencias</option>
        </select>
        <div *ngIf="form.controls['profession'].invalid && form.controls['profession'].touched">
          <small>Este campo es obligatorio</small>
        </div>
    </div>
  </div>
