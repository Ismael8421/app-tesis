<ion-content>
  <div class="chat-container">
    <div class="chat-title">Chats</div>

    <div class="search-container">
      <form>
        <div class="search-input">
          <input type="text" placeholder="Buscar" required class="ion-color-light" />
          <button type="submit" class="ion-color-light">
            <app-recomendatio-icon class="icon" />
          </button>
        </div>
      </form>
    </div>

    <ion-list lines="full" class="ion-no-padding">
      <ng-container *ngIf="chats$ | async as chats">
        <!-- Añadimos un click handler al ion-item -->
        <ion-item *ngFor="let chat of chats" 
                  button 
                  detail 
                  class="chat-item"
                  (click)="navigateTo(chat.id)">
          <ion-avatar slot="start">
            <img src="https://img.freepik.com/vector-premium/vector-dibujos-animados-icono-galleta-cuadrada-comida-galleta-azucar-dulce_98402-61270.jpg">
          </ion-avatar>
          <ion-label>
            <h3>{{ getUserName(chat.participants) }}</h3>
            <p>{{ chat.lastMessage || 'No hay mensajes' }}</p>
            <small *ngIf="chat.lastMessageTimestamp">
              {{ chat.lastMessageTimestamp | date:'short' }}
            </small>
          </ion-label>
        </ion-item>

        <div *ngIf="chats.length === 0" class="no-chats">
          <p>No hay conversaciones activas</p>
        </div>
      </ng-container>
    </ion-list>
  </div>
</ion-content>
