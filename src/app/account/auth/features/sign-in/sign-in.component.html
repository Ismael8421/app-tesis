<ion-content>
  <section>
    <div class="logo-container">
      <img src="icons/logo_tesis.png" alt="Tecnifind Logo">
    </div>
    
    <h1>Inicia sesión</h1>

    <div class="google-button-container">
      <app-google-button (click)="submitWithGoogle()"></app-google-button>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div>
        <ion-label>Correo</ion-label>
        <div class="input-with-icon">
          <ion-input 
            type="email" 
            formControlName="email"
            [class.invalid]="isRequired('email') || hasEmailError()"
          ></ion-input>
        </div>
        <small *ngIf="isRequired('email')">Este campo es requerido</small>
        <small *ngIf="hasEmailError()">Correo invalido</small>
      </div>

      <div>
        <ion-label>Contraseña</ion-label>
        <div class="input-with-icon">
          <ion-input 
            [type]="passwordInputType"
            formControlName="password"
            [class.invalid]="isRequired('password')"
          ></ion-input>
          <button type="button" class="toggle-password" (click)="togglePasswordVisibility()">
            <app-eye-button></app-eye-button>
          </button>
        </div>
        <small *ngIf="isRequired('password')">Este campo es requerido</small>
      </div>

      <div class="forgot-password">
        <ion-button fill="clear" routerLink="/auth/forgot-password">
          Olvidaste tu contraseña?
        </ion-button>
      </div>

      <ion-button type="submit" expand="block">
        Iniciar
      </ion-button>

      <p>
        No tienes una cuenta? 
        <a routerLink="/auth/sign-up">Registrarse</a>  
      </p>
    </form>
  </section>
</ion-content>
