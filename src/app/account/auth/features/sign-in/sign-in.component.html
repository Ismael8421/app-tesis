<section>
    <div>
      <div>
        <div>
          <div>
            <h1>Inicia sesión</h1>
            <div class="google-button-container">
              <app-google-button (onClick)="submitWithGoogle()"></app-google-button>
            </div>
          </div>
          <form [formGroup]="form" (ngSubmit)="submit()">
            <div>
              <label for="email">Correo</label><br>
              <input 
                type="email"
                name="email" 
                id="email"  
                placeholder="name@company.com" 
                formControlName="email"
              >
              <small *ngIf="isRequired('email')">Este campo es requerido</small>
              <small *ngIf="hasEmailError()">Correo invalido</small>
            </div>
  
            <div>
                <label for="password">Contraseña</label>
                <div class="input-with-icon">
                  <input 
                    [type]="passwordInputType"
                    name="password" 
                    id="password" 
                    placeholder="••••••••" 
                    formControlName="password"
                  >
                  <button type="button" class="toggle-password" (click)="togglePasswordVisibility()">
                    <app-eye-button />
                  </button>
                </div>
              </div>
  
            <div>
              <a href="#">Olvidaste tu contraseña?</a>
            </div>
  
            <button type="submit">Iniciar</button>
            <p>
              No tienes una cuenta? 
              <a routerLink="/auth/sign-up">Registrarse</a>
            </p>
          </form>
        </div>
      </div>
    </div>
  </section>
